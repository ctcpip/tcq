name: Stop Task in ECS Cluster

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      task:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  stop-ecs-task:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Find cluster containing ${{ inputs.environment }}
        id: find-cluster
        run: |
          CLUSTER_ARN=$(aws ecs list-clusters --query "clusterArns[?contains(@, '${{ inputs.environment }}')]" --output text | head -n1)
          if [ -z "$CLUSTER_ARN" ]; then
            echo "No cluster containing 'staging' found."
            exit 1
          fi
          echo "CLUSTER_ARN=$CLUSTER_ARN" >> $GITHUB_ENV

      - name: Find tcq task
        id: find-task
        run: |
          TASK_ARN=$(aws ecs list-tasks --cluster "$CLUSTER_ARN" --desired-status RUNNING --query "taskArns[]" --output text | xargs -n1 aws ecs describe-tasks --cluster "$CLUSTER_ARN" --tasks | jq -r '.tasks[] | select(.taskDefinitionArn | contains("${{ inputs.task }}")) | .taskArn' | head -n1)
          if [ -z "$TASK_ARN" ]; then
            echo "No running task containing 'tcq' found."
            exit 1
          fi
          echo "TASK_ARN=$TASK_ARN" >> $GITHUB_ENV

      - name: Stop tcq task
        run: |
          aws ecs stop-task --cluster "$CLUSTER_ARN" --task "$TASK_ARN" --output json
